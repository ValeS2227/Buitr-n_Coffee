<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buitrón Coffee — Iniciar Sesión</title>

  <!--
    Archivo: inisesi_reg_volini.html
    Ubicación: raíz del proyecto
    Propósito: Página de autenticación principal con tres pantallas:
    (1) Pantalla de opciones: Iniciar sesión / Registrarse / Volver al inicio.
    (2) Pantalla de login: formulario con usuario y contraseña.
    (3) Pantalla de bienvenida: confirmación tras iniciar sesión.
    Se accede desde el ícono de usuario en el header de cualquier página.
    Credenciales demo: usuario "admin" / contraseña "1234"
    Proyecto: Buitrón Coffee — Pitalito, Huila, Colombia
  -->

  <link rel="stylesheet" href="estilos/Index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

  <div class="card">

    <!-- PANTALLA 1: Opciones iniciales (por defecto visible) -->
    <div id="inicio" class="seccion">
      <h1>Buitrón Coffee</h1>
      <button onclick="mostrarLogin()">Inicia sesión</button>
      <button onclick="location.href='Registro.html'">Regístrate</button>
      <button onclick="location.href='Buitron_Coffee.html'">Volver al inicio</button>
    </div>

    <!-- PANTALLA 2: Formulario de inicio de sesión -->
    <div id="login" class="seccion">
      <h1>Buitrón Coffee</h1>
      <h2>Bienvenido al inicio de sesión</h2>

      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" placeholder="Ingrese usuario">

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••">

      <button onclick="iniciarSesion()">Ingresar</button>
      <button onclick="volverInicio()">Volver</button>

      <!-- Links de navegación relacionados con auth -->
      <div class="links-login">
        <p>¿Olvidaste tu contraseña?
          <a href="Recuperar_Contrasena.html">Recuperar</a>
        </p>
      </div>
      <div class="links-login">
        <p>¿No tienes cuenta?
          <a href="Registro.html">Regístrate</a>
        </p>
      </div>
    </div>

    <!-- PANTALLA 3: Bienvenida tras iniciar sesión exitosamente -->
    <div id="bienvenida" class="seccion bienvenida">
      <h1>Buitrón Coffee</h1>
      <h2>Bienvenido a<br>Buitrón Coffee</h2>
      <button onclick="location.href='Buitron_Coffee.html'">Ir al inicio</button>
      <button onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

  </div>

  <script>
    // Oculta todas las pantallas de auth
    function ocultarTodo() {
      document.getElementById('inicio').style.display     = 'none';
      document.getElementById('login').style.display      = 'none';
      document.getElementById('bienvenida').style.display = 'none';
    }

    // Muestra la pantalla de login
    function mostrarLogin() {
      ocultarTodo();
      document.getElementById('login').style.display = 'block';
    }

    // Vuelve a la pantalla de opciones
    function volverInicio() {
      ocultarTodo();
      document.getElementById('inicio').style.display = 'block';
    }

    // Valida credenciales y muestra bienvenida
    // Credenciales demo: usuario "admin" / contraseña "1234"
    function iniciarSesion() {
      var usuario  = document.getElementById('usuario').value.trim();
      var password = document.getElementById('password').value;
      if (usuario === 'admin' && password === '1234') {
        ocultarTodo();
        document.getElementById('bienvenida').style.display = 'block';
      } else {
        alert('Usuario o contraseña incorrectos.\nDemo: usuario "admin" / contraseña "1234"');
      }
    }

    // Cierra sesión y vuelve a las opciones iniciales
    function cerrarSesion() {
      document.getElementById('usuario').value  = '';
      document.getElementById('password').value = '';
      volverInicio();
    }

    // Si viene desde Registro.html, mostrar pantalla de login directamente
    if (sessionStorage.getItem('mostrarLogin') === 'true') {
      sessionStorage.removeItem('mostrarLogin');
      mostrarLogin();
    }
  </script>

</body>
</html>
