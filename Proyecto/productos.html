<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Buitron Coffee - Producto</title>
        <link href="css/indexregristrado.css" rel="stylesheet" type="text/css"/>
        <link href="css/productos.css" rel="stylesheet" type="text/css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    </head>
    <body>
        <div class="topbar">Encontrarás descuentos por el día de hoy</div>
        <div class="header">

            <div class="logo-header">Buitrón Coffee</div>
            <div class="logo-img">
                <img src="img/logob.png" alt="Logo" class="logo-img">
            </div>


            <div class="icons">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar producto..." />
                    <i class="fa fa-magnifying-glass" onclick="buscarProducto()"></i>
                </div>
                <a href="usuario.html" title="Usuario">
                    <i class="fa fa-user"></i>
                </a>
                <a href="carrito.html" title="Ir a carrito">
                    <i class="fa fa-shopping-cart"></i>
                </a>
            </div>
        </div>
        <div class="nav">
            <button>Inicio</button>
            <button>Producción</button>
            <button>Nosotros</button>
            <button>Exportaciones</button>
        </div>

        <div class="hero">
            <img src="img/banner.jpeg" alt="Banner café" />
            <div class="hero-arrow">&#8964;</div>
        </div>

        <section class="producto-detalle">
            <div class="producto-container">
                <div class="producto-imagen">
                    <img id="producto-imagen" src="" alt="">
                </div>

                <div class="producto-info">
                    <h1 class="producto-titulo" id="producto-nombre"></h1>

                    <div class="producto-metadata">
                        <div class="metadata-item">
                            <span class="metadata-label">Estado:</span>
                            <span class="metadata-valor estado-activo" id="producto-estado">ACTIVO</span>
                        </div>

                        <div class="metadata-item">
                            <span class="metadata-label">Lvl. Tostado:</span>
                            <span class="metadata-valor" id="producto-tostado">Medio</span>
                        </div>
                    </div>

                    <div class="producto-calificacion">
                        <div class="estrellas" id="producto-estrellas">

                        </div>
                        <span class="calificacion-num" id="producto-puntuacion">5.0</span>
                    </div>

                    <div class="producto-precio" id="producto-precio">Desde $ 60.000</div>

                    <button class="btn-regresar" onclick="history.back()">← Regresar</button>
                </div>
            </div>

            <div class="divider"></div>

            <div class="reseñas-section">
                <h2 class="reseñas-titulo">Reseñas</h2>

                <div id="lista-reseñas" class="lista-reseñas"></div>

                <div class="nueva-reseña-form">
                    <h3>Deja tu reseña</h3>

                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Tu nombre" maxlength="50">
                    </div>

                    <div class="form-group">
                        <label for="reseña">Reseña</label>
                        <textarea id="reseña" placeholder="Escribe tu opinión..." rows="3" maxlength="500"></textarea>
                    </div>

                    <button class="btn-agregar" id="btn-agregar-reseña">Comentar</button>
                </div>
            </div>
        </section>

        <script src="js/productos-data.js"></script>
        <script src="js/resenas-producto.js"></script>
    </body>
</html>
