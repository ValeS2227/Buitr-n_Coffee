<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido al Inicio</title>
    <link rel="stylesheet" href="css/estilos_inicio_crud.css">
</head>

<body>
     <!--MODAL DE BIENVENIDA-->
    <div class="modal-overlay" id="modalBienvenida">
        <div class="modal-box">
            <div class="modal-logo">Buitron Coffee</div>
            <p class="modal-titulo">Bienvenido a la Administración de Buitrón Coffee</p>
            <button class="btn-gracias" onclick="cerrarModal()">GRACIAS</button>
        </div>
    </div>

    <div class="contenedor-principal">
        
        <!--Panel izquierdo-->
        <div class="panel-izquierdo">
            
            <div class="titulo-bienvenida">BIENVENIDO AL INICIO</div>
            <div class="avatar-circulo">
                
                <center>
                <svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="35" r="20" fill="none" stroke="black" stroke-width="5"/>
                    <path d="M10 90 Q10 60 50 60 Q90 60 90 90" fill="none" stroke="black" stroke-width="5"/>
                
                </svg>
                </center>
            </div>

            <p class="nombre-usuario">AdminLauris</p>

            <button class="btn-cerrar-sesion">Cerrar Sesión</button>
            
        </div>
        
        <!--Panel derecho-->
        <div class="panel-derecho">

            <!--Sección Usuarios-->
            <div class="seccion-titulo">USUARIOS</div>

            <div class="fila-botones">
                <div class="tarjeta-accion">
                    <svg width="65" height="65" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="35" r="20" fill="none" stroke="black" stroke-width="5"/>
                        <path d="M10 90 Q10 60 50 60 Q90 60 90 90" fill="none" stroke="black" stroke-width="5"/>
                    </svg>
                    <button class="btn-accion" onclick="window.location.href='Vizualización_de_usuarios.html'">VER</button>
                </div>

                <div class="tarjeta-accion">
                    <svg width="65" height="65" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="35" r="20" fill="none" stroke="black" stroke-width="5"/>
                        <path d="M10 90 Q10 60 50 60 Q90 60 90 90" fill="none" stroke="black" stroke-width="5"/>
                    </svg>
                    <button class="btn-accion" onclick="window.location.href='Inhabilitar_usuarios.html'">INHABILITAR</button>

                </div>
            </div>

            <!--Sección Productos-->
            <div class="seccion-titulo">PRODUCTOS</div>

            <div class="fila-botones">
                <div class="tarjeta-accion">
                    <svg width="65" height="65" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="none" stroke="black" stroke-width="5"/>
                        <line x1="10" y1="30" x2="50" y2="50" stroke="black" stroke-width="5"/>
                        <line x1="90" y1="30" x2="50" y2="50" stroke="black" stroke-width="5"/>
                        <line x1="50" y1="50" x2="50" y2="90" stroke="black" stroke-width="5"/>
                        <line x1="30" y1="20" x2="70" y2="40" stroke="black" stroke-width="3"/>
                    </svg>
                    <button class="btn-accion" onclick="window.location.href='Crear_producto.html'">CREAR </button>

                </div>

                <div class="tarjeta-accion">
                    <svg width="65" height="65" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="none" stroke="black" stroke-width="5"/>
                        <line x1="10" y1="30" x2="50" y2="50" stroke="black" stroke-width="5"/>
                        <line x1="90" y1="30" x2="50" y2="50" stroke="black" stroke-width="5"/>
                        <line x1="50" y1="50" x2="50" y2="90" stroke="black" stroke-width="5"/>
                        <line x1="30" y1="20" x2="70" y2="40" stroke="black" stroke-width="3"/>
                    </svg>
                    <button class="btn-accion" onclick="window.location.href='Ver_producto.html'">VER </button>

                </div>

                <div class="tarjeta-accion">
                    <svg width="65" height="65" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="none" stroke="black" stroke-width="5"/>
                        <line x1="10" y1="30" x2="50" y2="50" stroke="black" stroke-width="5"/>
                        <line x1="90" y1="30" x2="50" y2="50" stroke="black" stroke-width="5"/>
                        <line x1="50" y1="50" x2="50" y2="90" stroke="black" stroke-width="5"/>
                        <line x1="30" y1="20" x2="70" y2="40" stroke="black" stroke-width="3"/>
                    </svg>
                    <button class="btn-accion" onclick="window.location.href='Actualizar_producto.html'">ACTUALIZAR </button>
                </div>

                <div class="tarjeta-accion">
                    <svg width="65" height="65" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="50,10 90,30 90,70 50,90 10,70 10,30" fill="none" stroke="black" stroke-width="5"/>
                        <line x1="10" y1="30" x2="50" y2="50" stroke="black" stroke-width="5"/>
                        <line x1="90" y1="30" x2="50" y2="50" stroke="black" stroke-width="5"/>
                        <line x1="50" y1="50" x2="50" y2="90" stroke="black" stroke-width="5"/>
                        <line x1="30" y1="20" x2="70" y2="40" stroke="black" stroke-width="3"/>
                    </svg>
                    <button class="btn-accion" onclick="window.location.href='Inhabilitar_producto.html'">INHABILITAR</button>
                </div>
            </div>

        </div>
        
    </div>
 <!-- SCRIPT: función cerrarModal -->
    <script>
        function cerrarModal() {
            document.getElementById("modalBienvenida").classList.add("oculto");
        }
    </script>
</body>
</html>
