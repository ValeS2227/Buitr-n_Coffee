<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Buitron Coffee</title>
        <link href="css/indexregristrado.css" rel="stylesheet" type="text/css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    </head>
    <body>

        <div class="topbar">Encontrarás descuentos por el día de hoy</div>

        <div class="header">

            <div class="logo-header">Buitrón Coffee</div>
            <div class="logo-img">
                <img src="img/logob.png" alt="Logo" class="logo-img">
            </div>


            <div class="icons">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar producto..." />
                    <i class="fa fa-magnifying-glass" onclick="buscarProducto()"></i>
                </div>
                <a href="usuario.html" title="Usuario">
                    <i class="fa fa-user"></i>
                </a>
                <a href="carrito.html" title="Ir a carrito">
                    <i class="fa fa-shopping-cart"></i>
                </a>
            </div>
        </div>

        <div class="nav">
            <button>Inicio</button>
            <button>Producción</button>
            <button>Nosotros</button>
            <button>Exportaciones</button>
        </div>

        <div class="hero"></div>

        <div class="section">

            <div class="tabs">
                <span class="active">Ideales para ti</span>
                <span>Café por Mayor</span>
            </div>

            <div class="cards" id="cardsContainer">

                <div class="card" data-nombre="café molido">
                    <img src="img/cafe1.jpeg" alt=""/>
                    <p>Café Molido</p>
                    <p>Desde $60.000</p>
                    <button class="btn-ver" onclick="location.href='productos.html?id=1'">VER</button>
                </div>

                <div class="card" data-nombre="grano">
                    <img src="img/cafe3.jpeg" alt=""/>
                    <p>Grano</p>
                    <p>Desde $65.000</p>
                    <button class="btn-ver" onclick="location.href='productos.html?id=2'">VER</button>
                </div>

                <div class="card" data-nombre="grano especial">
                    <img src="img/cafe3.jpeg" alt=""/>
                    <p>Grano Especial</p>
                    <p>Desde $70.000</p>
                    <button class="btn-ver" onclick="location.href='productos.html?id=3'">VER</button>
                </div>

            </div>
        </div>

        <!-- MODAL -->
        <div class="overlay" id="bienvenida">
            <div class="modal" id="modalContent">
                <div class="logo">Buitron Coffee</div>
                <div class="titulo" id="modalMessage">Bienvenido a<br>Buitrón Coffee</div>
                <button class="boton" id="modalButton" onclick="cerrarAviso()">GRACIAS</button>
            </div>
        </div>
        <script src="js/indexregistrado.js" type="text/javascript"></script>
    </body>
</html>
