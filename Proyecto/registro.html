<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buitrón Coffee - Registro</title>
  <link href="css/registro.css" rel="stylesheet" type="text/css"/>
</head>

<body class="auth-body">

  <div class="card">
    <h1>Buitrón Coffee</h1>
    <h2>Bienvenido al Registro</h2>

    <form action="#" method="POST">

      <label>Nombre usuario</label>
      <input type="text" name="nombre" placeholder="Ingrese su nombre" required>

      <label>Apellido</label>
      <input type="text" name="apellido" placeholder="Ingrese su apellido" required>

      <label>Número de documento</label>
      <input type="number" name="documento" placeholder="Ingrese su documento" required>

      <label>Número de Teléfono</label>
      <input type="tel" name="telefono" placeholder="Ingrese número" required>

      <label>Correo Electrónico</label>
      <input type="email" name="correo" placeholder="Ingrese correo" required>

      <label>Contraseña</label>
      <input type="password" name="password" placeholder="Ingrese contraseña" required>

      <button type="submit">Registrarse</button>
      <button type="button" onclick="irALogin()" class="btn-secundario">
        ¿Ya tienes cuenta? Inicia sesión
      </button>

    </form>
  </div>
    <script src="js/registro.js" type="text/javascript"></script>
</body>
</html>
