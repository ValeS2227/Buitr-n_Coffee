<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login Buitrón Coffee</title>
<link rel="stylesheet" href="css/estilos_inicio_admin.css">
<script>
function mostrarConfirmacion(){
    document.getElementById("pantallaLogin").style.display="none";
    document.getElementById("pantallaBienvenida").style.display="block";
}
</script>

</head>

<body>

<div class="card">

    <!-- Pantalla Login -->
    <div id="pantallaLogin">
        <h1>Buitrón Coffee</h1>
        <h2>Bienvenido al inicio de sesión Admin</h2>

        <label>Usuario</label>
        <input type="text" placeholder="Ingrese usuario">

        <label>Contraseña</label>
        <input type="password">

        <button onclick="mostrarConfirmacion()">Iniciar Sesión</button>
    </div>

    <!-- Pantalla Bienvenida -->
    <div id="pantallaBienvenida">
        <h1>Buitrón Coffee</h1>
        <h2>Bienvenido a la Administración de Buitrón Coffee</h2>
        <button onclick="location.reload()">Gracias</button>
    </div>

</div>

</body>
</html>
