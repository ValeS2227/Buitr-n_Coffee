<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buitrón Coffee — Registro</title>

  <!--
    Archivo: Registro.html
    Ubicación: raíz del proyecto
    Propósito: Formulario de registro de nuevos usuarios. Solicita:
    nombre, apellido, número de documento, teléfono, correo electrónico
    y contraseña. Al enviar muestra un mensaje de confirmación.
    Al hacer clic en "¿Ya tienes cuenta?" redirige al login.
    Proyecto: Buitrón Coffee — Pitalito, Huila, Colombia
  -->

  <link rel="stylesheet" href="estilos/Index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

  <div class="card">

    <!-- Pantalla de registro (por defecto visible) -->
    <div id="pantallaRegistro">
      <h1>Buitrón Coffee</h1>
      <h2>Bienvenido al Registro</h2>

      <label for="reg-nombre">Nombre</label>
      <input type="text" id="reg-nombre" placeholder="Ingrese su nombre" required>

      <label for="reg-apellido">Apellido</label>
      <input type="text" id="reg-apellido" placeholder="Ingrese su apellido" required>

      <label for="reg-documento">Número de documento</label>
      <input type="number" id="reg-documento" placeholder="Ingrese su documento" required>

      <label for="reg-telefono">Número de teléfono</label>
      <input type="tel" id="reg-telefono" placeholder="Ingrese número" required>

      <label for="reg-correo">Correo electrónico</label>
      <input type="email" id="reg-correo" placeholder="Ingrese correo" required>

      <label for="reg-password">Contraseña</label>
      <input type="password" id="reg-password" placeholder="Ingrese contraseña" required>

      <button onclick="registrar()">Registrarse</button>
      <button onclick="irALogin()">¿Ya tienes cuenta? Inicia sesión</button>
    </div>

    <!-- Pantalla de confirmación de registro exitoso -->
    <div id="pantallaExito" class="hidden">
      <div class="logo">Buitrón Coffee</div>
      <div class="confirmacion">
        ✅ ¡Registro exitoso!<br>
        Ya puedes iniciar sesión con tu cuenta.
      </div>
      <button onclick="location.href='inisesi_reg_volini.html'">Iniciar sesión</button>
      <button onclick="location.href='Buitron_Coffee.html'">Ir al inicio</button>
    </div>

  </div>

  <script>
    // Valida campos y muestra confirmación de registro
    function registrar() {
      var nombre    = document.getElementById('reg-nombre').value.trim();
      var apellido  = document.getElementById('reg-apellido').value.trim();
      var documento = document.getElementById('reg-documento').value.trim();
      var telefono  = document.getElementById('reg-telefono').value.trim();
      var correo    = document.getElementById('reg-correo').value.trim();
      var password  = document.getElementById('reg-password').value;

      // Validación básica de campos obligatorios
      if (!nombre || !apellido || !documento || !telefono || !correo || !password) {
        alert('Por favor completa todos los campos.');
        return;
      }

      // Validación simple de correo
      if (!correo.includes('@')) {
        alert('Por favor ingresa un correo válido.');
        return;
      }

      // Validación de contraseña mínima
      if (password.length < 4) {
        alert('La contraseña debe tener al menos 4 caracteres.');
        return;
      }

      // Muestra confirmación
      document.getElementById('pantallaRegistro').classList.add('hidden');
      document.getElementById('pantallaExito').classList.remove('hidden');
    }

    // Redirige al login usando sessionStorage para abrir directamente esa pantalla
    function irALogin() {
      sessionStorage.setItem('mostrarLogin', 'true');
      location.href = 'inisesi_reg_volini.html';
    }
  </script>

</body>
</html>
