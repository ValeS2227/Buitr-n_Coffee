<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buitrón Coffee - Recuperar Contraseña</title>
  <link href="css/recuperar_contra.css" rel="stylesheet" type="text/css"/>
  </head>

<body class="auth-body">

  <div class="card">

    <div class="logo">Buitrón Coffee</div>

    <!-- PANTALLA 1: Ingresar correo -->
    <div id="pantalla1">
      <h2>Recupera tu contraseña</h2>
      <div class="mensaje">
        Se enviará un código de verificación a tu correo registrado
      </div>
      <label>Correo electrónico</label>
      <input type="email" placeholder="tucorreo@email.com" required>
      <button onclick="mostrarConfirmacion()">Enviar</button>
      <button onclick="location.href='iniciosesion.html'">Volver al inicio</button>
    </div>

    <!-- PANTALLA 2: Confirmación de envío -->
    <div id="pantalla2" class="hidden">
      <div class="confirmacion">
        ✅ Se ha enviado un código de verificación a tu correo
      </div>
      <button onclick="mostrarCodigo()">Ingresar Código</button>
    </div>

    <!-- PANTALLA 3: Ingresar código de 4 dígitos -->
    <div id="pantalla3" class="hidden">
      <h2>Ingresa el código</h2>
      <div class="codigo-container">
        <input type="text" maxlength="1" class="codigo">
        <input type="text" maxlength="1" class="codigo">
        <input type="text" maxlength="1" class="codigo">
        <input type="text" maxlength="1" class="codigo">
      </div>
      <button onclick="mostrarNuevaContrasena()">Enviar Código</button>
    </div>

    <!-- PANTALLA 4: Nueva contraseña -->
    <div id="pantalla4" class="hidden">
      <h2>Nueva contraseña</h2>
      <label>Nueva contraseña</label>
      <input type="password" placeholder="Ingresa tu nueva contraseña" required>
      <button onclick="mostrarConfirmacionFinal()">Guardar</button>
    </div>

    <!-- PANTALLA 5: Éxito -->
    <div id="pantalla5" class="hidden">
      <div class="confirmacion">
        ✅ Tu contraseña ha sido cambiada correctamente
      </div>
      <button onclick="location.href='iniciosesion.html'">Iniciar sesión</button>
    </div>

  </div>
    <script src="js/recuperar_contra.js" type="text/javascript"></script>
</body>
</html>
