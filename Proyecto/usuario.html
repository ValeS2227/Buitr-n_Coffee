<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Mi Perfil - Buitrón Coffee</title>
        <link rel="stylesheet" href="css/usuario.css">
    </head>
    <body>
        <header class="nav">
            <button onclick="location.href='indexregistrado.html'">Regresar al Inicio</button>
            <span>admin</span>
        </header>
        <div class="perfil-container">

            <h1>Mi Perfil</h1>

            <div class="perfil-card">

                <div class="foto-section">
                    <img src="img/perfil.jpg" id="previewFoto" class="foto-perfil">
                    <input type="file" id="fotoInput" accept="image/*">
                    <button onclick="location.href='index.html'">Cerrar Sesión</button>
                </div>

                <div class="info-section">

                    <label>Nombre de Usuario</label>
                    <input type="text" value="admin">

                    <label>Número de Documento</label>
                    <input type="text" value="123456789">

                    <label>Número de Teléfono</label>
                    <input type="text" value="3001234567">

                    <label>Correo Electrónico</label>
                    <input type="email" value="admin@gmail.com">

                    <label>Contraseña</label>
                    <input type="password" value="1234">

                    <button class="btn-guardar">Guardar Cambios</button>

                </div>

            </div>

        </div>
        <script src="js/usuario.js" type="text/javascript"></script>
    </body>
</html>
